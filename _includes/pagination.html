{% if paginator.previous_page or paginator.next_page %}
  <li class="article-pagination">
    {% if paginator.previous_page %}
      <a href="{{ paginator.previous_page_path | relative_url }}" title="Newer posts">
        {% include svg-icon.html icon="arrow-left" %}
        Newer
      </a>
    {% endif %}
    {% if paginator.next_page %}
      <a class="article-pagination-right" href="{{ paginator.next_page_path | relative_url }}" title="Older posts">
        Older
        {% include svg-icon.html icon="arrow-right" %}
      </a>
    {% endif %}
  </li>
{% endif %}
